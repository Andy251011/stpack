[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stpack"
version = "0.1.0"
description = "Standardise raw spatial transcriptomics sample folders into per-sample archives"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stpack = "stpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
